<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <h1>🚫 DTF Фильтр слов</h1>

  <div class="stats">
    <span>Скрыто постов: <strong id="hiddenCount">—</strong></span>
    <span>Слов: <strong id="wordCount">0</strong></span>
  </div>

  <div class="add-section">
    <input type="text" id="addInput" class="add-input" placeholder="Добавить слово..." maxlength="50">
    <button class="btn-add" id="addBtn">+ Добавить</button>
  </div>

  <div class="search-section">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск по словам...">
    <button class="search-clear" id="searchClear" title="Очистить">×</button>
  </div>

  <!-- Кастомные слова -->
  <div class="section-header">
    <span>Мои слова</span>
  </div>
  <div class="tags-container" id="customTagsContainer">
    <div class="empty-state">Нет добавленных слов</div>
  </div>

  <div class="divider"></div>

  <!-- Предустановленные слова -->
  <div class="section-header">
    <span>Предустановленные (<span id="presetCount">0</span>)</span>
    <button class="section-toggle" id="presetToggle">▼</button>
  </div>
  <div class="tags-container" id="presetTagsContainer">
    <!-- Пресеты будут здесь -->
  </div>

  <div class="warning" id="warning">⚠️ Нажмите «Сохранить» чтобы применить изменения</div>

  <div class="footer-fixed">
    <div class="actions">
      <button class="btn-save" id="saveBtn">💾 Сохранить</button>
      <button class="btn-reset" id="resetBtn">↻ Сброс</button>
    </div>
    <div class="success" id="success">✓ Сохранено!</div>
    <div class="footer-links">
      <a href="https://github.com/jtsdtess/dtf-no-giveaways" target="_blank" class="footer-link" title="GitHub">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
      </a>
      <button class="footer-link" id="settingsBtn" title="Настройки">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Модальное окно настроек -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <span>Настройки</span>
        <button class="modal-close" id="modalClose">×</button>
      </div>
      <div class="modal-body">
        <label class="setting-row">
          <span class="setting-label">Показывать уведомления о скрытых постах</span>
          <div class="toggle">
            <input type="checkbox" id="notifyToggle" class="toggle-input">
            <span class="toggle-slider"></span>
          </div>
        </label>
      </div>
    </div>
  </div>

  <script src="../content/presets.js"></script>
  <script src="popup.js"></script>
</body>

</html>
