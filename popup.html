<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <h1>🚫 DTF Фильтр</h1>

  <div class="stats">
    <span>Скрыто постов: <strong id="hiddenCount">—</strong></span>
    <span>Слов: <strong id="wordCount">0</strong></span>
  </div>

  <div class="add-section">
    <input type="text" id="addInput" class="add-input" placeholder="Добавить слово..." maxlength="50">
    <button class="btn-add" id="addBtn">+ Добавить</button>
  </div>

  <!-- Кастомные слова -->
  <div class="section-header">
    <span>Мои слова</span>
  </div>
  <div class="tags-container" id="customTagsContainer">
    <div class="empty-state">Нет добавленных слов</div>
  </div>

  <div class="divider"></div>

  <!-- Предустановленные слова -->
  <div class="section-header">
    <span>Предустановленные (<span id="presetCount">0</span>)</span>
    <button class="section-toggle" id="presetToggle">▼</button>
  </div>
  <div class="tags-container" id="presetTagsContainer">
    <!-- Пресеты будут здесь -->
  </div>

  <div class="warning" id="warning">⚠️ Нажмите «Сохранить» чтобы применить изменения</div>

  <div class="footer-fixed">
    <div class="actions">
      <button class="btn-save" id="saveBtn">💾 Сохранить</button>
      <button class="btn-reset" id="resetBtn">↻ Сброс</button>
    </div>
    <div class="success" id="success">✓ Сохранено!</div>
  </div>

  <textarea id="keywords" style="display: none;"></textarea>

  <script src="presets.js"></script>
  <script src="popup.js"></script>
</body>

</html>
